# ==========================================================
# Job Market Intelligence & Skill Analytics Platform
# pytest.ini
#
# `pythonpath = .` makes the project root importable, so tests can simply
# `from src.data import queries` instead of manipulating sys.path by hand.
# `testpaths = tests` keeps the default run limited to the test folder.
# ==========================================================

[pytest]
testpaths = tests
pythonpath = .
